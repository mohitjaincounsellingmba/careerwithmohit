<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="emblem-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    
    <!-- Gold / Yellow Accent -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle Outer Background -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#emblem-bg)" stroke="#93C5FD" stroke-width="12" stroke-opacity="0.4"/>
  <rect x="24" y="24" width="464" height="232" rx="128" fill="url(#gloss)"/>

  <!-- Stylized Cap Diamond Board -->
  <polygon points="256,100 420,180 256,260 92,180" fill="#FFFFFF" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.25))"/>
  
  <!-- Cap Skull Base Arch -->
  <path d="M160,225 V295 C160,335 200,360 256,360 C312,360 352,335 352,295 V225" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" fill="none"/>

  <!-- Upward Career Growth Arrow (in Gold) -->
  <path d="M256,320 V160 M256,160 L210,206 M256,160 L302,206" stroke="url(#gold-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tassel Cord and Fringe -->
  <circle cx="410" cy="220" r="18" fill="url(#gold-grad)"/>
  <path d="M350,195 L410,220" stroke="url(#gold-grad)" stroke-width="14" stroke-linecap="round"/>

  <!-- Active Status / Live Pulse Ring -->
  <circle cx="440" cy="72" r="32" fill="#10B981" stroke="#FFFFFF" stroke-width="10"/>
</svg>
